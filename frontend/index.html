<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Harper Pad</title>
    <meta name="description" content="Grammar-checked editor with a scratch pad drawer." />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Painted before any script has arrived: the page colours (styles/tokens.css, inlined by vite.config.js) and a title (on a phone only: the same query as App.vue's `narrow`), so a cold start is not a blank
         screen while the scripts download and the first draft is read. Vue replaces the contents of #app when it mounts. -->
    <style>
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px / 1.5 system-ui, sans-serif; }
      #app > .splash { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 100dvh; font-size: 20px; font-weight: 600; }
      @media (max-width: 720px), (pointer: coarse) and (max-height: 500px) { #app > .splash { display: flex; } }
      #app > .splash span { opacity: 0.6; }
    </style>
  </head>
  <body>
    <div id="app"><div class="splash"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="14" fill="#f59e0b"/><path d="M20 16v26M44 16v26M20 29h24" fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/><path d="M14 50q4-5 8 0t8 0 8 0 8 0 4-2" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Harper Pad</span></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
