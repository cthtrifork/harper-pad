<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Harper Pad</title>
    <meta name="description" content="Grammar-checked editor with a scratch pad drawer." />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Painted before any script has arrived: the page colours (same as styles/tokens.css) and a title, so a cold start is not a blank
         screen while the scripts download and the first draft is read. Vue replaces the contents of #app when it mounts. -->
    <style>
      body { margin: 0; background: #f6f7f9; color: #1a2028; font: 14px / 1.5 system-ui, sans-serif; }
      #app > .splash { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; font-size: 20px; font-weight: 600; opacity: 0.6; }
      @media (prefers-color-scheme: dark) { body { background: #12161b; color: #e8ebef; } }
    </style>
  </head>
  <body>
    <div id="app"><div class="splash">Harper Pad</div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
