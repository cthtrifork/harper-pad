# Generated from the Go types of the routes by `make openapi` in backend/ (cmd/openapi).
# Do not edit by hand: regenerate it when a route, a field or a constraint changes.
components:
  schemas:
    BaseStruct:
      additionalProperties: false
      properties:
        updatedAt:
          description: The stored updatedAt the device saw
          format: int64
          minimum: 0
          type: integer
        version:
          description: The stored version the device saw; 0 when it believes the server has no such draft
          format: int64
          minimum: 0
          type: integer
      required:
        - version
        - updatedAt
      type: object
    Doc:
      additionalProperties: false
      properties:
        createdAt:
          description: Unix ms
          format: int64
          type: integer
        data:
          description: The draft as a JSON string, {"v":1,"format":"markdown","content":"..."}; empty for a tombstone
          type: string
        deleted:
          type: boolean
        id:
          pattern: ^[0-9a-f]{32}$
          type: string
        updatedAt:
          description: Unix ms
          format: int64
          type: integer
        version:
          format: int64
          type: integer
      required:
        - id
        - version
        - createdAt
        - updatedAt
        - deleted
        - data
      type: object
    DocState:
      additionalProperties: false
      properties:
        deleted:
          description: A tombstone
          type: boolean
        id:
          pattern: ^[0-9a-f]{32}$
          type: string
        updatedAt:
          description: Unix ms, set by the device that saved the draft
          format: int64
          type: integer
        version:
          description: "Per-draft counter: 1 on creation, +1 on each accepted write. Only for compare-and-set."
          format: int64
          type: integer
      required:
        - id
        - version
        - updatedAt
        - deleted
      type: object
    EnrollInputBody:
      additionalProperties: false
      properties:
        deviceName:
          description: Used only when the invite carries no name
          maxLength: 64
          type: string
        invite:
          description: "The invite token from the enrollment URL fragment: 43 characters of base64url"
          type: string
      required:
        - invite
      type: object
    EnrollOutputBody:
      additionalProperties: false
      properties:
        deviceToken:
          description: "256 random bits, base64url. Send it as Authorization: DPoP <token>"
          type: string
        token_type:
          enum:
            - DPoP
          type: string
      required:
        - deviceToken
        - token_type
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    PutDocInputBody:
      additionalProperties: false
      properties:
        base:
          $ref: "#/components/schemas/BaseStruct"
        createdAt:
          description: Unix ms
          format: int64
          minimum: 0
          type: integer
        data:
          description: The draft as a JSON string (see GET); empty when deleted
          type: string
        deleted:
          description: True to delete the draft; omitted means false
          type: boolean
        updatedAt:
          description: Unix ms
          format: int64
          minimum: 0
          type: integer
      required:
        - base
        - createdAt
        - updatedAt
        - data
      type: object
    PutDocOutputBody:
      additionalProperties: false
      properties:
        version:
          description: The draft's new version
          format: int64
          type: integer
      required:
        - version
      type: object
    PutSettingInputBody:
      additionalProperties: false
      properties:
        baseVersion:
          description: The stored version the device saw; 0 when it believes the server has none
          format: int64
          minimum: 0
          type: integer
        ignored:
          description: See GET
          items:
            type: string
          type: array
        words:
          description: See GET
          items:
            type: string
          type: array
      required:
        - baseVersion
        - words
        - ignored
      type: object
    PutSettingOutputBody:
      additionalProperties: false
      properties:
        version:
          description: The setting's new version
          format: int64
          type: integer
      required:
        - version
      type: object
    Setting:
      additionalProperties: false
      properties:
        ignored:
          description: The decimal hashes of Harper's ignore list, as text because they are 64-bit. The server stores them as they came.
          items:
            type: string
          type: array
        version:
          description: "Compare-and-set counter: 1 on creation, +1 on each accepted write"
          format: int64
          type: integer
        words:
          description: The personal dictionary. The server stores it as it came; the devices check each entry.
          items:
            type: string
          type: array
      required:
        - version
        - words
        - ignored
      type: object
  securitySchemes:
    DPoP:
      description: "`Authorization: DPoP <device token>` together with a `DPoP` proof header made with the key the device enrolled with."
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: How the sync works (docs/sync.md)
  url: https://github.com/cthtrifork/harper-pad/blob/main/docs/sync.md
info:
  contact:
    name: Harper Pad
    url: https://github.com/cthtrifork/harper-pad
  description: "The optional sync service of Harper Pad (docs/sync.md). Every route needs a DPoP proof header; routes other than /enroll also need `Authorization: DPoP <device token>`. The proof is a JWT signed with the device's key (RFC 9449 section 4.2): `typ` `dpop+jwt`, `alg` `ES256`, the public key in the `jwk` header, and the claims `jti`, `htm`, `htu`, `iat` and, with a token, `ath`. Credential failures are all the same 401 and say nothing about the cause."
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: Harper Pad sync API
  version: dev
openapi: 3.1.0
paths:
  /docs:
    get:
      description: The states of the account's drafts without their text, tombstones included, in id order. Page with `after` (the last id of the previous page) until a page has fewer than `limit` entries.
      operationId: listDocs
      parameters:
        - description: DPoP proof
          in: header
          name: DPoP
          schema:
            description: DPoP proof
            type: string
        - description: DPoP <device token>
          in: header
          name: Authorization
          schema:
            description: DPoP <device token>
            type: string
        - description: List drafts whose id sorts after this one
          explode: false
          in: query
          name: after
          schema:
            description: List drafts whose id sorts after this one
            pattern: ^([0-9a-f]{1,32})?$
            type: string
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 500
            description: Page size
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DocState"
                type:
                  - array
                  - "null"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - DPoP: []
      summary: List the state of every draft
      tags:
        - drafts
  /docs/{id}:
    get:
      description: The draft with its text, or a tombstone. The `ETag` is the draft's `updatedAt` and `deleted`; `If-None-Match` with the same tag returns 304.
      operationId: getDoc
      parameters:
        - description: DPoP proof
          in: header
          name: DPoP
          schema:
            description: DPoP proof
            type: string
        - description: DPoP <device token>
          in: header
          name: Authorization
          schema:
            description: DPoP <device token>
            type: string
        - description: The ETag of the state the device last synced
          in: header
          name: If-None-Match
          schema:
            description: The ETag of the state the device last synced
            type: string
        - in: path
          name: id
          required: true
          schema:
            pattern: ^[0-9a-f]{32}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doc"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - DPoP: []
      summary: Get one draft
      tags:
        - drafts
    put:
      description: "Accepted only if the stored draft has the `base` version and `updatedAt` (version 0 for an id the server does not have). Otherwise nothing changes and the 409 carries the server's current copy. A deletion is `deleted: true` with empty `data`; the server clears the text of a tombstone."
      operationId: putDoc
      parameters:
        - description: DPoP proof
          in: header
          name: DPoP
          schema:
            description: DPoP proof
            type: string
        - description: DPoP <device token>
          in: header
          name: Authorization
          schema:
            description: DPoP <device token>
            type: string
        - in: path
          name: id
          required: true
          schema:
            pattern: ^[0-9a-f]{32}$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutDocInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutDocOutputBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  current:
                    $ref: "#/components/schemas/Doc"
                    description: The server's current copy of the draft; absent when the server has none
                  detail:
                    type: string
                  status:
                    format: int64
                    type: integer
                  title:
                    type: string
                required:
                  - title
                  - status
                  - detail
                type: object
          description: The stored draft is not the base the write was made against
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - DPoP: []
      summary: Write one draft (compare-and-set)
      tags:
        - drafts
  /enroll:
    post:
      description: Spends an invite from the admin UI and issues a device token bound to the key in the DPoP proof. The proof is checked before the body is read. A wrong, spent or expired invite, a bad or replayed proof and a missing proof are all the same 401.
      operationId: enroll
      parameters:
        - description: DPoP proof signed by the new key (its public key is in the proof's jwk header)
          in: header
          name: DPoP
          schema:
            description: DPoP proof signed by the new key (its public key is in the proof's jwk header)
            type: string
        - description: Stored with the device, at most 200 characters
          in: header
          name: User-Agent
          schema:
            description: Stored with the device, at most 200 characters
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollOutputBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Enroll a device
      tags:
        - enrollment
  /settings:
    get:
      description: The personal dictionary (`words`) and the hashes of Harper's ignore list (`ignored`) in one document. 404 until a device has stored it.
      operationId: getSettings
      parameters:
        - description: DPoP proof
          in: header
          name: DPoP
          schema:
            description: DPoP proof
            type: string
        - description: DPoP <device token>
          in: header
          name: Authorization
          schema:
            description: DPoP <device token>
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - DPoP: []
      summary: Get the synced settings
      tags:
        - settings
    put:
      description: "Accepted only if the stored version is `baseVersion` (0 when the server has none). Otherwise nothing changes and the 409 carries the current settings. The server never merges: the last write wins."
      operationId: putSettings
      parameters:
        - description: DPoP proof
          in: header
          name: DPoP
          schema:
            description: DPoP proof
            type: string
        - description: DPoP <device token>
          in: header
          name: Authorization
          schema:
            description: DPoP <device token>
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSettingInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutSettingOutputBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  current:
                    $ref: "#/components/schemas/Setting"
                    description: The server's current setting; absent when the server has none
                  detail:
                    type: string
                  status:
                    format: int64
                    type: integer
                  title:
                    type: string
                required:
                  - title
                  - status
                  - detail
                type: object
          description: The stored settings are not the base the write was made against
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - DPoP: []
      summary: Write the synced settings (compare-and-set)
      tags:
        - settings
servers:
  - url: https://sync.example.com
tags:
  - description: Spend an invite from the admin UI and get a device token.
    name: enrollment
  - description: List, read and write the drafts of an enrolled device.
    name: drafts
  - description: The personal dictionary and the ignore list, one document; the last device to write wins.
    name: settings
