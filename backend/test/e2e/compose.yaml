# End-to-end stack (docs/sync.md, "End-to-end test"): PostgreSQL, harper-pad-sync and Caddy providing https. A plain compose spec, so
# podman and docker both read it. Test-only credentials; never reuse them.
#
#   https://app.localhost:${E2E_PORT:-18443}   the web build (frontend/dist-web, built by `make e2e-web`)
#   https://sync.localhost:${E2E_PORT:-18443}  harper-pad-sync, through Caddy
# Only https is published: there is no port 80 and no redirect.
name: harper-pad-e2e

volumes:
  pgcerts:

services:
  postgres:
    image: mirror.gcr.io/library/postgres:17
    # Makes the CA and certificates into the pgcerts volume (certs.sh), then starts the image's entrypoint. TLS is required and the role
    # logs in only with a client certificate whose common name is the role, as the CloudNativePG cluster does (docs/sync.md, "Database
    # access"). The password only satisfies the image's init script.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "/certs.sh && exec docker-entrypoint.sh \"$$@\"", "sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - ssl_ca_file=/certs/ca.crt
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - hba_file=/certs/pg_hba.conf
    environment:
      POSTGRES_DB: harper
      # The bootstrap superuser: reachable only over the container's local socket (pg_hba.conf from certs.sh refuses it over TCP). The
      # services log in as harper_admin (the owner of the database and its tables) and harper_sync (rows only), never as this one,
      # so the grants the tests check are the ones that apply.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e-only
    volumes:
      - ./certs.sh:/certs.sh:ro,z
      - pgcerts:/certs
      # First-start initialisation: the two roles and the database owner, which the cluster creates in production. The schema is not
      # applied here: harper-pad-admin applies the migrations at start, as harper_admin, the owner, as in production.
      - ./initdb/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro,z
    # Published on loopback only, for the store tests on the host (make test-db); the certificates are TLS 1.3, client-cert only.
    ports:
      - "127.0.0.1:${E2E_PG_PORT:-15432}:5432"
    # The data is thrown away with the stack, so keep it in memory.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # Over TCP: the init script runs a temporary server that listens on the socket only, so a socket check reports ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d harper"]
      interval: 2s
      timeout: 3s
      retries: 30

  sync:
    build:
      context: ../..
      dockerfile: Containerfile.sync
    environment:
      LISTEN_ADDR: ":8080"
      PUBLIC_URL: https://sync.localhost:${E2E_PORT:-18443}
      CORS_ALLOWED_ORIGINS: https://app.localhost:${E2E_PORT:-18443}
      # Client-certificate login with no password, configured the way the cluster does it: the libpq variables.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: harper
      PGUSER: harper_sync
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /certs/ca.crt
      PGSSLCERT: /certs/client.crt
      PGSSLKEY: /certs/client.key
    volumes:
      - pgcerts:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      # The admin applies the schema; the sync service reports ready only once it has (it waits, so this is only an ordering hint).
      admin:
        condition: service_started

  # The admin UI, logging in to PostgreSQL as harper_admin with its client certificate, like the cluster. harper_admin owns the
  # tables and applies the migrations at start. Plain HTTP on loopback (in production Cloudflare terminates TLS); `make admin-up`
  # starts it, `make admin-seed` adds devices.
  admin:
    build:
      context: ../..
      dockerfile: Containerfile.admin
    environment:
      LISTEN_ADDR: ":9001"
      SYNC_PUBLIC_URL: https://sync.localhost:${E2E_PORT:-18443}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: harper
      PGUSER: harper_admin
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /certs/ca.crt
      PGSSLCERT: /certs/admin.crt
      PGSSLKEY: /certs/admin.key
    ports:
      - "127.0.0.1:${E2E_ADMIN_PORT:-19001}:9001"
    volumes:
      - pgcerts:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    # Pinned by version and digest (Renovate updates both), so a new Caddy cannot change the stack under CI.
    image: mirror.gcr.io/library/caddy:2.11.7@sha256:04913b1da43339a40ad1ea87827d70a576ac5aa6cf674c6e24fdca675887533a
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2020/health"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${E2E_PORT:-18443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ../../../frontend/dist-web:/srv/app:ro,z
    depends_on:
      - sync
