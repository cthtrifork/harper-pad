{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true,"includeIndicatorStyles":false,"historyCacheSize":0}'>
<title>Harper Pad admin</title>
<link rel="stylesheet" href="/static/admin.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/admin.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token":"{{.CSRF}}"}'>
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.4 1.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="7" height="8" rx="1.2"/><path d="M3.5 10.5v-7a1 1 0 0 1 1-1h6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2.5l6 10.5H2z"/><path d="M8 7v3M8 11.8v.1"/></symbol>
</svg>
<div class="win">
  <header class="bar">
    <div class="brand">Harper Pad <span>admin</span></div>
    {{with .Account}}<span class="acct">Account: {{.}}</span>{{end}}
  </header>
  <main class="page">
    <div id="flash" role="alert" aria-live="polite"></div>
    {{template "content" .}}
  </main>
</div>
</body>
</html>{{end}}
