name: Linux build dependencies
description: >-
  Installs the apt packages passed in `packages` (e.g. the GTK4 + WebKitGTK 6 build headers Wails v3
  needs, from the Wails CI). The .deb files are cached per runner image, so a
  warm run installs them with dpkg and never touches the Ubuntu mirror.

inputs:
  packages:
    description: Space-separated apt packages to install.
    required: true

runs:
  using: composite
  steps:
    - id: image
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "packages=$(echo "$PACKAGES" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-debs
        key: apt-debs-${{ runner.os }}-${{ steps.image.outputs.packages }}-${{ steps.image.outputs.version }}
        restore-keys: |
          apt-debs-${{ runner.os }}-${{ steps.image.outputs.packages }}-

    # actions/cache outputs only cache-hit (an exact match), so do not gate on it: a restore-key hit from an older runner image is
    # worth trying too. With no debs, or ones that do not fit this image, this fails and the apt step below runs.
    - id: cached
      continue-on-error: true
      shell: bash
      run: sudo apt-get install -y --no-download --no-install-recommends ~/apt-debs/*.deb

    # A stalled mirror trickles data forever and apt's own timeout never fires, so bound each attempt.
    - if: steps.cached.outcome != 'success'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        PACKAGES: ${{ inputs.packages }}
      with:
        timeout_minutes: 3
        max_attempts: 3
        command: |
          # The runner's apt sources use mirror+file:/etc/apt/apt-mirrors.txt, and its regional mirror (us-east-2.ec2.archive.ubuntu.com)
          # has been stalling. apt does not take the first entry, so leave only the main archive.
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          # Debs restored from the cache (an older image's, or an incomplete set) are used where the version matches; only the rest is downloaded.
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ || true
          sudo apt-get -o Acquire::Languages=none update -qq
          sudo apt-get install -y --no-install-recommends $PACKAGES
          # What apt used or downloaded is everything this image lacks; keep it for the cache.
          mkdir -p ~/apt-debs
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ || true # nothing downloaded if the image already has them
