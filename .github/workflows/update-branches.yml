name: Update branches

# Keeps the owner's open pull requests current with main: after every push to main, each open PR whose branch is behind gets main
# merged into it, so CI runs again and the PR stays mergeable under "Require branches to be up to date". A personal account has no
# merge queue.
#   - Skipped: PRs by anyone else, from forks, drafts, with merge conflicts (listed in the job summary), and renovate/* or bot/*.
#   - Pushed as the Renovate GitHub App, not GITHUB_TOKEN, because a push with GITHUB_TOKEN starts no workflows.
#   - Each push to main re-runs CI on every behind PR. That is the price of "always up to date".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A later push to main makes this run's list stale, so queue instead of cancelling mid-update.
concurrency:
  group: update-branches
  cancel-in-progress: false

jobs:
  update:
    name: update branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {} # everything below uses the App token
    steps:
      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write # merge main into the PR branch
          permission-pull-requests: write # the update-branch endpoint

      - name: Update PR branches that are behind main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "### Update branches" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          # Tab-separated, so a branch name cannot split a field. Fork PRs and drafts are filtered out.
          gh pr list --repo "$REPO" --base "$BASE" --state open --author "$OWNER" --limit 100 \
            --json number,headRefName,headRefOid,isDraft,isCrossRepository \
            --jq '.[] | select(.isDraft == false and .isCrossRepository == false) | [.number, .headRefName, .headRefOid] | @tsv' |
          while IFS=$'\t' read -r number ref sha; do
            case "$ref" in
              renovate/* | bot/*) continue ;;
            esac
            behind=$(gh api "repos/$REPO/compare/$BASE...$ref" --jq .behind_by)
            if [ "$behind" -eq 0 ]; then
              continue
            fi
            # expected_head_sha makes GitHub refuse the update if the branch moved since the list.
            if out=$(gh api --method PUT "repos/$REPO/pulls/$number/update-branch" -f expected_head_sha="$sha" 2>&1); then
              echo "- #$number \`$ref\`: updated ($behind commits behind)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- #$number \`$ref\`: **not updated** ($behind commits behind): $(printf '%s' "$out" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::PR #$number ($ref) was not updated"
            fi
          done
