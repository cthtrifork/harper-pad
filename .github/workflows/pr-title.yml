name: PR title

# Enforces the PR title convention (`type(scope)!: summary`) and labels the PR from it. Squash merges use the title as the commit
# subject and the release notes group PRs by its type (.github/release-drafter.yml).
#   - check title: validates the title. Runs for every PR; make it a required check to enforce it on merge.
#   - label: release-drafter's autolabeler sets the label and drops a stale one when the title is edited. Skipped for fork PRs.
#   - Skipped: bot/* branches.
# It runs on synchronize because a required check belongs to the head commit, and update-branches.yml pushes a new one.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: check title
    if: ${{ !startsWith(github.head_ref, 'bot/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the PR title
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Keep in step with .github/release-drafter.yml and docs/releasing.md.
          types: |
            feat
            fix
            security
            perf
            refactor
            docs
            test
            chore
            revert
            ci
            build
            deps

  label:
    name: label PR
    if: ${{ !startsWith(github.head_ref, 'bot/') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the autolabeler reads .github/release-drafter.yml
      pull-requests: write # add and remove labels
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
