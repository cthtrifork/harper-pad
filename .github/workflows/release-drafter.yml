name: Release Drafter

# Keeps a draft release up to date as PRs merge: notes grouped by .github/release-drafter.yml and the next version worked out from
# the PR titles. The draft is the source of the next version for "Tag and release"; nothing is published from here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One writer at a time; a later run has the newer list, so a queued run is enough.
concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  draft:
    name: update draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create and update the draft release
      pull-requests: read # the merged PRs and their labels
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
