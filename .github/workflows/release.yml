name: Release

# Publishes a GitHub release (and the two backend container images on ghcr.io) with signed Linux and Windows binaries, packages, the Windows installer,
# SHA256SUMS, an SBOM and attestations. The in-app updater installs the raw binary of its platform and verifies it against
# SHA256SUMS, so those asset names are an interface. Three ways to run it:
#   - the "Tag and release" workflow calls it (workflow_call) with a version and a commit. This is the normal route: the tag does
#     not exist yet, and GitHub creates it when the release is published.
#   - pushing a tag like v1.2.3 (or v1.2.3-rc.1) from a machine.
#   - by hand (workflow_dispatch) on a branch for a dry run that builds but does not publish. On a tag ref it publishes, which
#     also retries a failed release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The version to release (v1.2.3 or v1.2.3-rc.1); created at sha when the release is published
        required: true
        type: string
      sha:
        description: The commit to build and tag. Empty means the tag must already exist and is built as it is.
        required: false
        type: string
    secrets:
      RELEASE_GPG_PRIVATE_KEY:
        description: Armored PGP private key that signs the .deb and .rpm (gpg --export-secret-keys --armor)
        required: false
      RELEASE_GPG_PASSPHRASE:
        description: Passphrase of that key; leave unset for a key without one
        required: false

permissions:
  contents: read

# Two runs for the same tag must not publish at once; a started release is never cancelled.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  APP: harper-pad
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.2

jobs:
  # The version and the "is this a real release" decision, on their own so the checks and the binary
  # build can start at once instead of queueing behind one job.
  meta:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called with a commit, build exactly that; with only a tag, that tag; otherwise the ref that triggered the run.
          ref: ${{ inputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # publish=true when there is a tag to release, false for a dry run on a branch.
          if [ -n "$INPUT_TAG" ]; then
            version="$INPUT_TAG"; publish=true
          elif [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"; publish=true
          else
            version="v0.0.0-dryrun.$(git rev-parse --short HEAD)"; publish=false
          fi
          if [ "$publish" = true ] && ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$version' is not a semantic version like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Releases must come from main
        if: steps.meta.outputs.publish == 'true'
        run: |
          git fetch --no-tags origin main
          # HEAD is the commit being released (checked out above), whichever way this run started.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Released commit is not on main"; exit 1
          fi

  # Never ship something CI would have rejected. Runs beside the build; the images and the release
  # both wait for it.
  checks:
    name: vet, test, govulncheck
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called with a commit, build exactly that; with only a tag, that tag; otherwise the ref that triggered the run.
          ref: ${{ inputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || '' }}
          persist-credentials: false

      - uses: $/.github/actions/linux-build-deps
        with:
          packages: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
        timeout-minutes: 10

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          cache: ${{ needs.meta.outputs.publish != 'true' }} # off when publishing: a restored cache could poison the release; on for dry runs # zizmor: ignore[cache-poisoning]
          cache-dependency-path: go.sum

      - name: Vet and test
        run: make vet test

      # The Windows build needs no cgo, so the Linux runner can prove it still compiles (the Windows job below builds it).
      # The backend is its own module and its images are published below, so it is checked here too. The database tests need the
      # compose stack and run in CI (test-backend); the rest runs without one.
      - name: Vet, build and test (backend)
        working-directory: backend
        run: make vet build test

      - name: Vet (windows/amd64)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet -tags production ./...

      - name: govulncheck
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.9.0
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

      - name: govulncheck (backend)
        working-directory: backend
        env:
          GOVULNCHECK_VERSION: v1.9.0
        run: go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" ./...

  build:
    name: build linux/amd64
    needs: meta
    # Pinned rather than "latest": the binary links dynamically against glibc,
    # so the runner image decides which distributions can run it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called with a commit, build exactly that; with only a tag, that tag; otherwise the ref that triggered the run.
          ref: ${{ inputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || '' }}
          persist-credentials: false

      # The README promises a binary built on Ubuntu 24.04 (that fixes the glibc and WebKitGTK
      # baseline). Like wails-build-action's distro discovery, fail loudly if the runner is
      # anything else instead of silently shipping a different baseline.
      - name: Check the build distribution
        run: |
          . /etc/os-release
          if [ "$ID" != "ubuntu" ] || [ "$VERSION_ID" != "24.04" ]; then
            echo "::error::Expected Ubuntu 24.04 but this runner is $PRETTY_NAME"; exit 1
          fi
          echo "Building on $PRETTY_NAME"

      - uses: $/.github/actions/linux-build-deps
        with:
          packages: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
        timeout-minutes: 10

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          cache: ${{ needs.meta.outputs.publish != 'true' }} # off when publishing: a restored cache could poison the release; on for dry runs # zizmor: ignore[cache-poisoning]
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Toolchain versions
        run: |
          go version
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0

      # The wails3 CLI (for the packages below) compiles alongside the binary rather than after it.
      - name: Build
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          # The sync server's https origin (a repository variable, empty when sync is off): the page's policy names it (docs/sync.md).
          SYNC_ORIGIN: ${{ vars.SYNC_ORIGIN }}
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          built="$RUNNER_TEMP/build/${APP}"
          mkdir -p "$(dirname "$built")"
          GOBIN="$RUNNER_TEMP/bin" CGO_ENABLED=0 make wails3-install &
          tools=$!
          make build OUT="$built"
          wait "$tools"
          chmod +x "$built"
          # The MCP server and the pprof endpoint are development tools without authentication (docs/mcp.md, docs/pprof.md).
          if grep -aqF "MCP server started" "$built" || grep -aqF "pprof endpoint started" "$built"; then
            echo "::error::a development endpoint (MCP or pprof) is present in the release binary"; exit 1
          fi
          # Raw binary (what the in-app updater installs), tarball (for people) and SHA256SUMS.
          # The layout matters: see docs/self-update.md and internal/selfupdate. SHA256SUMS is
          # written after the SBOM is added (below).
          mkdir -p dist
          cp "$built" "dist/${APP}_linux_amd64"
          tar -czf "dist/${APP}_${VERSION}_linux_amd64.tar.gz" -C "$(dirname "$built")" "$APP" -C "$PWD" README.md LICENSE

      # The .deb and .rpm are built from the same binary with nfpm (build/linux/nfpm/nfpm.yaml). A release is signed with the PGP key
      # in the RELEASE_GPG_* secrets and fails without it; a dry run builds unsigned packages. The key only lives in RUNNER_TEMP.
      - name: Build and sign the .deb and .rpm
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PUBLISH: ${{ needs.meta.outputs.publish }}
          GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          NFPM_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          unset PKG_SIGNING_KEY_FILE
          if [ -n "$GPG_KEY" ]; then
            keydir="$(mktemp -d)"
            trap 'rm -rf "$keydir"' EXIT
            printf '%s\n' "$GPG_KEY" > "$keydir/private.asc"
            export PKG_SIGNING_KEY_FILE="$keydir/private.asc"
            # Publish the matching public key and show its fingerprint, so the key can be checked.
            gpg --batch --import "$keydir/private.asc"
            fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/{print $10; exit}')"
            gpg --batch --armor --export "$fpr" > "dist/${APP}-release-key.asc"
            echo "Signing packages with PGP key $fpr"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::RELEASE_GPG_PRIVATE_KEY is not set, so the .deb and .rpm cannot be signed (see docs/releasing.md)"; exit 1
          else
            echo "::warning::RELEASE_GPG_PRIVATE_KEY is not set: the packages in this dry run are unsigned"
          fi
          scripts/package-linux.sh "$RUNNER_TEMP/build/${APP}" "$VERSION" dist

      # CycloneDX SBOM from the lockfiles: the Go modules and npm packages bundled into the binary. Named without os/arch so the in-app
      # updater's asset matcher cannot mistake it for the binary. Vulnerabilities are scanned in security.yml, not here.
      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          scanners: license
          version: ${{ env.TRIVY_VERSION }}
          output: ${{ runner.temp }}/sbom.cdx.json
          skip-dirs: frontend/node_modules,dist

      # SHA256SUMS is written by the publish job, once the Linux and Windows files are together.
      - name: Add SBOM to the release files
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: cp "$RUNNER_TEMP/sbom.cdx.json" "dist/${APP}_${VERSION}.sbom.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-linux
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # The Windows release file: one exe, built by scripts/package-windows.sh. It is also what the in-app updater
  # installs. The build needs no cgo; it runs on Windows so the exe can be signed, checked and started before anything
  # is published.
  build-windows:
    name: build windows/amd64
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called with a commit, build exactly that; with only a tag, that tag; otherwise the ref that triggered the run.
          ref: ${{ inputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || '' }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          cache: ${{ needs.meta.outputs.publish != 'true' }} # off when publishing: a restored cache could poison the release; on for dry runs # zizmor: ignore[cache-poisoning]
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Install the wails3 CLI and build the frontend
        env:
          # The sync server's https origin (a repository variable, empty when sync is off): the page's policy names it (docs/sync.md).
          SYNC_ORIGIN: ${{ vars.SYNC_ORIGIN }}
        run: |
          CGO_ENABLED=0 go install -tags server github.com/wailsapp/wails/v3/cmd/wails3@"$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 version
          (cd frontend && npm ci --ignore-scripts --no-audit --no-fund && npm run build)

      - name: Build the exe
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          scripts/package-windows.sh "$VERSION" dist

      # The MCP server and the pprof endpoint are development tools without authentication (docs/mcp.md, docs/pprof.md).
      - name: Release binary contains no development endpoint
        run: |
          if grep -aqF "MCP server started" dist/${APP}_windows_amd64.exe || grep -aqF "pprof endpoint started" dist/${APP}_windows_amd64.exe; then
            echo "::error::a development endpoint (MCP or pprof) is present in the Windows release binary"; exit 1
          fi

      # Authenticode signing through SignPath (docs/windows.md). Only for a real release, and only once the repository
      # has the SignPath variables and secret; until then the release goes out unsigned, with a warning. The signed
      # exe replaces the unsigned one before anything else uses it, so SHA256SUMS and the attestations cover the signed file.
      - name: Upload the exe for signing
        id: unsigned
        if: needs.meta.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-exe
          path: dist/harper-pad_windows_amd64.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the exe with SignPath
        if: needs.meta.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'harper-pad' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed exe and check its signature
        if: needs.meta.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item signed/harper-pad_windows_amd64.exe dist/harper-pad_windows_amd64.exe -Force
          $sig = Get-AuthenticodeSignature dist/harper-pad_windows_amd64.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { Write-Error "the signed exe does not have a valid Authenticode signature: $($sig.Status)"; exit 1 }

      - name: Warn when the release is unsigned
        if: needs.meta.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID == ''
        run: echo "::warning::SIGNPATH_ORGANIZATION_ID is not set, so the Windows exe is not signed and SmartScreen will warn (see docs/windows.md)"

      # Start the exe like a user would and check it stays up for 20 s (it loads WebView2 and the embedded frontend).
      # A crash on start fails the release.
      - name: Smoke test, the exe starts and keeps running
        env:
          MSYS_NO_PATHCONV: '1' # Git Bash would rewrite /F as a path
        run: |
          dist/${APP}_windows_amd64.exe &
          sleep 20
          # tasklist cuts image names at 25 characters, so match the start of the name.
          if ! tasklist | grep -qi "${APP}_windows"; then
            echo "::error::${APP}_windows_amd64.exe is not running 20 s after it was started"; exit 1
          fi
          echo "${APP}_windows_amd64.exe is running"
          taskkill /F /IM ${APP}_windows_amd64.exe

      # The installer (NSIS, per user, build/windows/nsis) is built from the exe above, so after signing it carries the
      # signed file. The installer itself is not signed yet (docs/windows.md). The check installs it silently and removes it again.
      # The runner image no longer ships NSIS, so install it (the script finds makensis.exe in Program Files).
      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build the installer
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          scripts/package-windows-installer.sh "$VERSION" dist/${APP}_windows_amd64.exe dist

      - name: Installer installs and uninstalls
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: scripts/check-windows-installer.sh "dist/${APP}_${VERSION}_windows_amd64_installer.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-windows
          path: |
            dist/${{ env.APP }}_windows_amd64.exe
            dist/${{ env.APP }}_*_windows_amd64_installer.exe
          if-no-files-found: error
          retention-days: 14

  # The backend images go out with the other release artifacts: only for a tagged release, and only after vet, tests and
  # govulncheck have passed (backend-image.yml already built, scanned and started them). The release is published once they are pushed.
  images:
    name: publish image (${{ matrix.name }})
    needs: [meta, checks]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read # check out the tag
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write # store the attestations
    strategy:
      fail-fast: false
      matrix:
        name: [sync, admin]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/harper-pad-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || '' }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags: 1.2.3 and v1.2.3, plus latest for a final release (not for a pre-release).
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.version }}
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.sha }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Containerfile.${{ matrix.name }}
          platforms: linux/amd64
          push: true
          # BuildKit attaches a SLSA provenance and an SBOM attestation to the image in the registry.
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ needs.meta.outputs.sha }}
            APP_VERSION=${{ needs.meta.outputs.version }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The cluster pins by digest.
      - name: Digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish release
    needs: [meta, checks, build, build-windows, images]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # update the draft release, upload assets and publish it
      pull-requests: read # Release Drafter reads the merged PRs
      id-token: write # sign the provenance attestation
      attestations: write # store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-files-*
          merge-multiple: true
          path: dist

      # SHA256SUMS lists every asset, Linux and Windows. The updater looks it up by this fixed name.
      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum $(ls | grep -vx SHA256SUMS | sort) > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*_linux_amd64
            dist/*_windows_amd64.exe
            dist/*_windows_amd64_installer.exe
            dist/*.sbom.cdx.json

      # Unlike subject-path, sbom-path takes one literal path (no glob), so resolve it first.
      - name: Locate SBOM
        id: sbom
        run: echo "path=$(ls dist/*.sbom.cdx.json)" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*_linux_amd64
          sbom-path: ${{ steps.sbom.outputs.path }}

      # Fail the release if what was just signed does not verify against this workflow.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for f in dist/*_linux_amd64 dist/*_windows_amd64.exe dist/*_windows_amd64_installer.exe \
                   dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sbom.cdx.json; do
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml"
          done
          gh attestation verify dist/*_linux_amd64 --repo "$REPO" \
            --predicate-type https://cyclonedx.org/bom

      # The notes come from Release Drafter (.github/release-drafter.yml). Aimed at the built commit, it
      # writes the draft for exactly this tag, from the PRs merged since the last published release up to
      # that commit, so a retried release gets the notes of the commit that was built.
      - name: Draft the release notes
        id: notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          tag: ${{ needs.meta.outputs.version }}
          name: ${{ needs.meta.outputs.version }}
          commitish: ${{ needs.meta.outputs.sha }}
          prerelease: ${{ needs.meta.outputs.prerelease }}

      # Assets go onto the draft and the draft is then published, so the release appears complete (and is locked with its assets when
      # immutable releases are on). `gh` finds a draft by its pending tag name, so if release-drafter.yml retargets the draft meanwhile,
      # these calls fail instead of publishing the wrong tag.
      - name: Attach the build and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.version }}
          TARGET: ${{ needs.meta.outputs.sha }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          # A retry finds the assets of an earlier, failed attempt on the draft; their names carry the
          # version, so --clobber replaces them.
          gh release upload "$TAG" dist/* --clobber

          latest=true
          [ "$PRERELEASE" = true ] && latest=false
          # Publishing creates the tag when it does not exist yet. --target pins it to the built commit, because release-drafter.yml may
          # have moved the draft to the head of main since the notes step. An existing tag is used as it is.
          printf '%s' "$NOTES" | gh release edit "$TAG" --target "$TARGET" --draft=false \
            --prerelease="$PRERELEASE" --latest="$latest" --title "$TAG" --notes-file -
          echo "Published $TAG"

  # The web version on GitHub Pages follows the releases: a final release replaces the root of the site (pages.yml); the head of main
  # is at /preview/. A pre-release is not published there. A failed deploy here does not undo the release; run Pages by hand on the tag.
  pages:
    name: publish web version
    needs: [meta, publish]
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false'
    permissions:
      contents: write # pushes the gh-pages branch
      pages: read # configure-pages reads the Pages settings
    uses: $/.github/workflows/pages.yml
    with:
      tag: ${{ needs.meta.outputs.version }}
