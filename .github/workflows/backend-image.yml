name: Backend images

# Checks the two backend container images (backend/Containerfile.sync and .admin) the way they are shipped: built, scanned with
# Trivy and started. Nothing is published from here; release.yml pushes them to ghcr.io. Runs for pull requests, per image: only the
# image whose inputs changed (the `changes` job below; not a required check), weekly (a new base-image CVE needs no commit) and by hand. See backend/README.md.
on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-image.yml
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.2
  # The DB comes from the cache that trivy-cache.yml refreshes daily.
  TRIVY_SKIP_DB_UPDATE: 'true'

jobs:
  # Pull requests only: which images changed. Weekly and manual runs build both. `matrix` is the list of image names for the job below.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # internal/** and the module files go into both binaries; the cmd directory and the Containerfile are per image.
      - id: sync
        if: github.event_name == 'pull_request'
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files: |
            backend/cmd/harper-pad-sync/**
            backend/internal/**
            backend/go.mod
            backend/go.sum
            backend/Containerfile.sync
            .github/workflows/backend-image.yml
          files_ignore: |
            backend/**/*_test.go
            backend/**/*.md

      - id: admin
        if: github.event_name == 'pull_request'
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files: |
            backend/cmd/harper-pad-admin/**
            backend/internal/**
            backend/go.mod
            backend/go.sum
            backend/Containerfile.admin
            .github/workflows/backend-image.yml
          files_ignore: |
            backend/**/*_test.go
            backend/**/*.md

      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          SYNC: ${{ steps.sync.outputs.any_changed }}
          ADMIN: ${{ steps.admin.outputs.any_changed }}
        run: |
          names=()
          if [ "$EVENT" != pull_request ] || [ "$SYNC" = true ]; then names+=(sync); fi
          if [ "$EVENT" != pull_request ] || [ "$ADMIN" = true ]; then names+=(admin); fi
          echo "matrix=$(jq -nc '$ARGS.positional' --args "${names[@]}")" >> "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.matrix) }}
        include:
          - name: sync
            port: 9000
            probe_port: 9102 # /healthz is on the metrics listener, not the public port
            env: -e PUBLIC_URL=https://sync.example.test
          - name: admin
            port: 9001
            probe_port: 9001
            env: -e LISTEN_ADDR=:9001 -e SYNC_PUBLIC_URL=https://sync.example.test
    env:
      IMAGE: harper-pad-${{ matrix.name }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image the runner can scan and start (linux/amd64 only). Layers are cached in the Actions cache; the
      # cache is only read by this workflow, never by release.yml, so it cannot reach a published image.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Containerfile.${{ matrix.name }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=backend-${{ matrix.name }}
          cache-to: type=gha,scope=backend-${{ matrix.name }},mode=max # zizmor: ignore[cache-poisoning]
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=ci

      # Only CRITICAL findings with a fix fail the job. HIGH findings are listed by the next step;
      # security.yml and dependency-scan.yml keep reporting them too.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          version: ${{ env.TRIVY_VERSION }}

      # HIGH and CRITICAL, never fails the job; the table is in the job summary.
      - name: Report all findings
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: image-scan.txt
          exit-code: '0'
          version: ${{ env.TRIVY_VERSION }}

      - name: Add the report to the job summary
        if: ${{ !cancelled() }}
        env:
          NAME: ${{ matrix.name }}
        run: |
          {
            echo "## Trivy image scan (${NAME}): all HIGH and CRITICAL findings with a fix"
            echo
            echo 'Only CRITICAL findings fail the job; HIGH findings are listed here for review.'
            echo
            echo '```'
            head -c 60000 image-scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The service must start and answer /healthz (on the metrics port for sync, the public one for admin). That needs no database; /readyz does. The image has
      # no shell or curl, so the check runs from the runner.
      - name: Smoke test
        env:
          PROBE_PORT: ${{ matrix.probe_port }}
          RUN_ENV: ${{ matrix.env }}
        run: |
          # shellcheck disable=SC2086 # RUN_ENV is a fixed list of -e options from the matrix above
          docker run -d --name smoke -p "${PROBE_PORT}:${PROBE_PORT}" $RUN_ENV "$IMAGE" serve
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:${PROBE_PORT}/healthz" && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
