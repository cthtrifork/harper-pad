name: Actions lint

# Static checks on the workflows themselves:
#   - zizmor finds security problems in workflows (injection, excessive permissions, unpinned actions, ...).
#   - gh-pin-actions checks that every `uses:` is pinned to a commit SHA with a version comment, and is the latest release.
#   - renovate-config validates .github/renovate.json5.
# They run when workflow, action or Renovate files change, and weekly because new zizmor audits appear without any change here.
# They have a paths filter, so do not mark them as required checks.
on:
  pull_request:
    paths:
      - .github/**
  push:
    branches: [main]
    paths:
      - .github/**
  schedule:
    - cron: '41 5 * * 1' # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pedantic persona. Installed from PyPI rather than through a marketplace action. The token lets zizmor run its
      # online audits (impostor commits, known-vulnerable actions); findings fail the job.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=pypi depName=zizmor
          ZIZMOR_VERSION: 1.32.0
        run: |
          python3 -m pip install --user "zizmor==${ZIZMOR_VERSION}"
          "$HOME/.local/bin/zizmor" --persona pedantic --format plain .

  # Pull requests only: on main, an action can have a new release that Renovate has not bumped yet.
  pin-actions:
    name: pin actions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # all_changed_files lists added, copied, modified and renamed files, not deleted ones.
      - name: Find the workflows this pull request adds or changes
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: .github/workflows/**.{yml,yaml}

      # --latest re-pins every `uses:` to the newest release. The tool rewrites all workflows, but the next step only checks the ones
      # the PR changes, so a new release of an action elsewhere does not fail unrelated PRs.
      - name: Pin actions
        if: steps.changed.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=amenocal/gh-pin-actions
          GH_PIN_ACTIONS_VERSION: v0.1.0
        run: |
          gh extension install amenocal/gh-pin-actions --pin "$GH_PIN_ACTIONS_VERSION"
          gh pin-actions workflows --latest --overwrite

      - name: Fail on unpinned or outdated actions
        if: steps.changed.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          # For immutable releases the tool writes the tag instead of the SHA: same version, so
          # compare `action@<sha> # vX` as `action@vX`. Any other difference fails (bash -e).
          norm='s/(uses: [^@ ]+)@[0-9a-f]{40} +# *([^ ]+).*/\1@\2/'
          for f in $CHANGED_FILES; do
            diff <(git show "HEAD:$f" | sed -E "$norm") <(sed -E "$norm" "$f")
          done

  renovate-config:
    name: renovate config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validates .github/renovate.json5 against Renovate's own schema and rules (unknown options,
      # bad regexes, invalid package rules). --strict also fails on a config that needs migrating.
      - name: Validate the Renovate config
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.221.6
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict .github/renovate.json5
