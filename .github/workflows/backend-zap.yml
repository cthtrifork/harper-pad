name: Backend ZAP scan

# OWASP ZAP against the sync backend, for the OWASP Top 10 classes a scanner can see from outside (see backend/test/zap/rules.tsv).
# It starts the end-to-end compose stack and runs ZAP's full scan against harper-pad-sync, then keeps the reports as an artifact,
# writes the job summary, uploads SARIF and keeps one PR comment up to date. Rules marked FAIL in rules.tsv fail the job. The active
# scan sends attacks, so it only ever targets this throwaway stack. Runs for pull requests that change the sync service or its stack
# (the `changes` job below; admin-only files, tests, docs and the e2e browser tests do not count; not a required check), weekly (new rules appear without a commit) and by hand.
# It cannot find logic flaws in the sync protocol until the API scan is pointed at an OpenAPI description (docs/sync.md).
on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-zap.yml
  schedule:
    - cron: '41 5 * * 1' # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-zap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned by digest; Renovate updates both the tag and the digest.
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:c2d63bbb2d907a5c5257914fb20e26e969c92b25f265def7f89f08203f912882

jobs:
  # Pull requests only: did the sync service (or what the scan stack is built from) change? Weekly and manual runs always scan.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sync: ${{ github.event_name != 'pull_request' || steps.changed.outputs.any_changed }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: changed
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            backend/cmd/harper-pad-sync/**
            backend/internal/**
            backend/go.mod
            backend/go.sum
            backend/Containerfile.sync
            backend/test/e2e/**
            backend/test/zap/**
            .github/workflows/backend-zap.yml
          files_ignore: |
            backend/**/*_test.go
            backend/**/*.md
            backend/test/e2e/*.mjs

  zap:
    name: zap (sync backend)
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # the SARIF upload
      pull-requests: write # the comment; the job runs no code from the pull request outside the container build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Caddy service mounts frontend/dist-web; the scan does not use it, but the directory must exist.
      - name: Start the stack
        timeout-minutes: 10
        run: |
          mkdir -p frontend/dist-web
          docker compose -f backend/test/e2e/compose.yaml up -d --build --wait

      # harper-pad-admin applies the schema (it owns the tables); harper-pad-sync is not ready until it has. The Makefile prefers
      # podman, which is also on the runner, so COMPOSE is set explicitly (the stack above was started with docker compose).
      - name: Wait for the schema
        timeout-minutes: 3
        env:
          COMPOSE: docker compose
        run: make -C backend wait-schema

      # The scan runs in a container on the stack's network and talks to the service directly (plain http, as Caddy does).
      # -m limits the spider and -T the wait for ZAP to start and the passive scan (minutes); neither bounds the active scan, which
      # is capped by the -z options (the whole scan, and any one rule, in minutes). `timeout` is the backstop: it stops the container
      # before the step timeout kills the runner, so the report and the comment are still written. Exit 1 means a FAIL rule fired,
      # 2 only warnings; anything above 2 is ZAP itself failing (124 is the backstop). The status is kept for the last step.
      - name: Run ZAP
        timeout-minutes: 18
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          set +e
          timeout --kill-after=30s 15m docker run --rm --name zap --network harper-pad-e2e_default \
            -v "$PWD/backend/test/zap:/zap/wrk/rules:ro" -v "$PWD/zap-out:/zap/wrk/out" \
            "$ZAP_IMAGE" zap-full-scan.py -t http://sync:8080 -c rules/rules.tsv \
            -m 3 -T 5 -z "-config scanner.maxScanDurationInMins=8 -config scanner.maxRuleDurationInMins=2" \
            -r out/report.html -J out/report.json
          status=$?
          docker rm -f zap > /dev/null 2>&1
          echo $status > zap-out/status

      # Annotations (errors for FAIL rules, warnings for the rest) and a markdown table for the job summary.
      - name: Report
        run: |
          [ -f zap-out/report.json ] || { echo "ZAP wrote no report" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          backend/test/zap/report.sh zap-out/report.json backend/test/zap/rules.tsv zap-out/summary.md
          cat zap-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      # The same alerts as SARIF, for the Security tab (code scanning). ZAP checks a running service, so the results are not tied to
      # a line of code; they are tracked by rule and URL, and closed when a later run no longer finds them. Pull requests from
      # forks have a read-only token and are skipped.
      - name: Convert to SARIF
        if: hashFiles('zap-out/report.json') != ''
        run: backend/test/zap/sarif.sh zap-out/report.json backend/test/zap/rules.tsv zap-out/zap.sarif

      - name: Upload to code scanning
        if: hashFiles('zap-out/zap.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          # The REST endpoint takes the gzipped, base64 encoded file. The commit is the one that ran, not the pull request's merge commit.
          gzip -c zap-out/zap.sarif | base64 -w0 > zap-out/zap.sarif.gz.b64
          gh api -X POST "repos/$GITHUB_REPOSITORY/code-scanning/sarifs" \
            -f commit_sha="$GITHUB_SHA" -f ref="$REF" -f tool_name="OWASP ZAP" \
            -F sarif=@zap-out/zap.sarif.gz.b64 --jq '.id'

      # One comment per pull request, updated in place on each run. Not for forks: their token is read-only.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('zap-out/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- harper-pad-zap -->'
          { echo "$marker"; cat zap-out/summary.md; echo; echo "[Full report]($RUN_URL) (the \`zap-report\` artifact)"; } > zap-out/comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@zap-out/comment.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@zap-out/comment.md > /dev/null
          fi

      - name: Fail when ZAP found a FAIL rule
        run: |
          status=$(cat zap-out/status 2>/dev/null || echo 99)
          echo "ZAP exit status $status"
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ]

      - name: Show the service log and stop the stack
        if: always()
        timeout-minutes: 3
        run: |
          docker compose -f backend/test/e2e/compose.yaml logs --no-color --tail 100 sync
          docker compose -f backend/test/e2e/compose.yaml down -v

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap-out/
          if-no-files-found: ignore
          retention-days: 14
