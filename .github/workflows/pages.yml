name: Pages

# Builds the web version of the frontend (docs/pages.md) and publishes it to the gh-pages branch:
#   - /          the latest release (release.yml calls this once a final release is published). Run by hand on a tag to redeploy it.
#   - /preview/  the head of main, on every push that touches the frontend.
#   - /pr-<n>/   opt-in previews of a pull request (preview.yml); left alone here.
# Pull requests only build it, so a broken web build is caught before merge. The build reads the site URL from the Pages settings.
#
# One-time setup: Settings > Pages > Source: Deploy from a branch, gh-pages, / (root).
on:
  pull_request:
    paths:
      - frontend/**
      - scripts/pages-publish.sh
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - frontend/**
      - scripts/pages-publish.sh
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The release tag (v1.2.3) to publish to the root of the site
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: read # configure-pages reads the Pages settings (custom domain or not) to work out the site's base path
    outputs:
      release: ${{ steps.target.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release call builds its tag; everything else builds the ref that triggered the run.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      # A release (called with a tag, or run by hand on a tag ref) goes to the root; main, a branch run and a pull request to preview/.
      - name: Work out where this goes
        id: target
        env:
          TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$TAG" ] || [ "$REF_TYPE" = tag ]; then release=true; else release=false; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      # base_path is empty on a custom domain (the site is at the root) and "/harper-pad" on <owner>.github.io.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the web version
        working-directory: frontend
        env:
          # /preview/ is what tells the frontend it is not the release (src/lib/scope.js, web/sw.js): its own localStorage keys and
          # service-worker cache on the shared origin. The IndexedDB database is shared on purpose (real data).
          BASE_PATH: ${{ steps.pages.outputs.base_path }}${{ steps.target.outputs.release == 'true' && '/' || '/preview/' }}
          # The sync server's https origin, a repository variable; empty (the default) leaves the policy as it was (docs/sync.md).
          SYNC_ORIGIN: ${{ vars.SYNC_ORIGIN }}
          # The release tag, shown small at the bottom right on a phone (StatusBar.vue). A preview has none and shows nothing.
          APP_VERSION: ${{ steps.target.outputs.release == 'true' && (inputs.tag || github.ref_name) || '' }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:web

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: frontend/dist-web
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # pushes the gh-pages branch
    # No concurrency group on purpose: a queued job that is replaced by a newer one could be a clean-up. The script retries its push when
    # preview.yml pushed first, and they only ever change their own folders.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Publish to gh-pages
        env:
          PAGES_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          MODE: ${{ needs.build.outputs.release == 'true' && 'site' || 'main' }}
        run: scripts/pages-publish.sh "$MODE" site
