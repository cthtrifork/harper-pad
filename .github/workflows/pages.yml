name: Pages

# Builds the web version of the frontend (`vite build --mode web`, see docs/pages.md) and deploys it to GitHub Pages
# on every push to main. Pull requests only build it, so a broken web build is caught before merge. The site is
# https://<owner>.github.io/harper-pad/.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Build the web version
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:web

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist-web

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
