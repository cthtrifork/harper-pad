name: CI

# Runs on every pull request and on pushes to main. There is no workflow-level paths filter, so the aggregate checks "CI / lint" and
# "CI / test" can be required. Instead the `changes` job works out which parts a PR touches and each job runs only when its part
# changed; a skipped job counts as passing, and the aggregates fail if any job they wait for failed. Pushes to main and manual runs
# run everything.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail on a Go version mismatch instead of silently downloading a toolchain.
  GOTOOLCHAIN: local

jobs:
  # Decides which parts of the repository a pull request touches. On pushes to main and manual runs every output is true.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists the files of a pull request through the API
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend }}
      bindings: ${{ github.event_name != 'pull_request' || steps.filter.outputs.bindings }}
      yaml: ${{ github.event_name != 'pull_request' || steps.filter.outputs.yaml }}
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend }}
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.e2e }}
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build }}
    steps:
      # On pull requests it lists the files through the API (no checkout needed); on pushes and manual
      # runs the filter is bypassed above.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - main.go
              - internal/**
              - go.mod
              - go.sum
              - .tool-versions
              - Makefile
              - .github/linters/golangci.yml
              - .github/workflows/ci.yml
              - .github/actions/**
            frontend:
              - frontend/**
              - internal/store/testdata/** # the frontend tests run the same fixtures as the Go tests
              - internal/app/testdata/**
              - .tool-versions
              - Makefile
              - .github/workflows/ci.yml
            bindings:
              - internal/app/**
              - frontend/bindings/**
              - go.mod
              - go.sum
              - .tool-versions
              - Makefile
              - .github/workflows/ci.yml
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
              - .github/linters/yamllint.yml
            backend:
              - backend/**
              - .tool-versions
              - .github/linters/golangci.yml
              - .github/workflows/ci.yml
            e2e:
              - backend/**
              - frontend/**
              - .tool-versions
              - .github/workflows/ci.yml
            build:
              - '**/*.go'
              - go.mod
              - go.sum
              - .tool-versions
              - Makefile
              - Taskfile.yml
              - frontend/**
              - build/**
              - scripts/package-*
              - scripts/lib/**
              - .github/workflows/ci.yml
              - .github/actions/**

  # --- lint: independent jobs, aggregated by `lint` below ---------------------------------------------------------

  # Biome lint, format check and knip (unused exports and dependencies, frontend/knip.json). Run `npm run format` to fix
  # formatting. Needs node_modules, not a bundle.
  lint-frontend:
    name: lint-frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Install frontend dependencies
        run: |
          node --version
          cd frontend && npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint and check formatting (frontend)
        run: make lint-frontend

  # Go formatting, module hygiene and golangci-lint for the desktop app (the root module; `./...` does not cross into
  # backend/, which has its own module and its own job).
  lint-go:
    name: lint-go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true # newest patch release of the version in .tool-versions, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "These files need gofmt:"; echo "$unformatted"; exit 1; fi

      - name: Check go.mod is tidy and modules verify
        run: |
          go mod tidy -diff
          go mod verify

      # Config in .github/linters/golangci.yml. Headless: this job has no GTK, so lint the server-tag build (CGO off, like
      # the headless build); the args mirror `make lint-go`. Renovate reads the version below itself and the
      # Makefile pin carries the same depName, so they are bumped in one PR.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          CGO_ENABLED: '0'
        with:
          version: v2.15.0
          args: --config .github/linters/golangci.yml --build-tags server ./...

  # frontend/bindings is generated from the Go services and committed. Regenerate it with the wails3 CLI that matches
  # go.mod and fail if the committed copy differs (run `make bindings`).
  bindings:
    name: bindings
    needs: changes
    if: needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Install frontend dependencies
        run: cd frontend && npm ci --ignore-scripts --no-audit --no-fund

      - id: wails3
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)" >> "$GITHUB_OUTPUT"

      # The wails3 CLI takes about 40 s to compile, so keep the built binary. The key is the Wails version
      # (the CLI follows go.mod) and the Go version it was built with.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: wails3-${{ steps.go.outputs.go-version }}-${{ steps.wails3.outputs.version }}

      - name: Check Wails bindings are up to date
        run: |
          [ -x "$RUNNER_TEMP/bin/wails3" ] || GOBIN="$RUNNER_TEMP/bin" make wails3-install
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bin:$PATH" make bindings
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            git status --short -- frontend/bindings
            git diff -- frontend/bindings | head -80
            echo "::error::frontend/bindings is stale: run 'make bindings' and commit the result"; exit 1
          fi

  # Config in .github/linters/yamllint.yml.
  lint-yaml:
    name: lint-yaml
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint YAML
        env:
          # renovate: datasource=pypi depName=yamllint
          YAMLLINT_VERSION: 1.38.0
        run: |
          python3 -m pip install --user "yamllint==${YAMLLINT_VERSION}"
          PATH="$HOME/.local/bin:$PATH" yamllint --strict -c .github/linters/yamllint.yml $(git ls-files '*.yml' '*.yaml')

  # The sync backend is its own Go module (backend/go.mod) and shares no code with the app, so it has its own lint job.
  lint-backend:
    name: lint-backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache yet: the module has no dependencies and so no go.sum to key it on. Turn it on with the first dependency.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          cache: false

      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "These files need gofmt:"; echo "$unformatted"; exit 1; fi

      - name: Check go.mod is tidy and modules verify
        working-directory: backend
        run: |
          go mod tidy -diff
          go mod verify

      # Same config and version as the app's lint job (renovate bumps both through the one depName).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          CGO_ENABLED: '0'
        with:
          version: v2.15.0
          working-directory: backend
          args: --config ${{ github.workspace }}/.github/linters/golangci.yml ./...

  # The aggregate check. Keeps the name "lint" so it can stay a required check while the work is split across jobs:
  # skipped jobs (nothing relevant changed) pass, a failed or cancelled one fails it. `changes` is waited for too, because
  # when it fails everything after it is skipped, which would otherwise look like a pass.
  lint:
    name: lint
    if: always()
    needs: [changes, lint-frontend, lint-go, bindings, lint-yaml, lint-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every lint job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) echo "::error::a lint job did not pass"; exit 1 ;;
          esac

  # Screenshots are rendered in CI and never committed (docs/ci.md, Pull request reports).
  no-screenshots:
    name: no-screenshots
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail when the PR adds screenshots
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Added, modified or renamed only: a PR that deletes screenshots is fine.
          files="$(git diff --name-only --diff-filter=AMR "$BASE_SHA...HEAD" -- docs/screenshots)"
          if [ -n "$files" ]; then
            echo "::error::Screenshots are not committed to this repository (docs/ci.md, Pull request reports). Remove docs/screenshots from this PR."
            echo "$files"
            exit 1
          fi

  # --- test: independent jobs, aggregated by `test` below ---------------------------------------------------------

  test-go:
    name: test-go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/linux-build-deps
        with:
          packages: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
        timeout-minutes: 10

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true # newest patch release of the version in .tool-versions, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      # Record exactly which toolchain and GUI libraries a run used (as wails-build-action does with `go version`).
      - name: Toolchain versions
        run: |
          go version
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0

      # No frontend build: frontend/dist/.gitkeep satisfies go:embed, and nothing here reads the bundle.
      # `go test` runs its own vet subset; the full `make vet` runs in the build job, which has compiled the same packages.
      - name: Test
        run: make test

  # The frontend's unit tests use Node's own runner, so no `npm ci` is needed.
  test-frontend:
    name: test-frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Install the frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Test the frontend
        run: make test-frontend

  test-backend:
    name: test-backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          cache: false # no go.sum yet, see lint-backend

      # `test-db` runs every test, the store tests included, against the e2e stack's PostgreSQL (TLS 1.3 and client certificates,
      # like the cluster; docs/sync.md, "Database access") and removes the stack afterwards. `docker compose` is preinstalled on the
      # runner; the Makefile prefers podman, so COMPOSE is set explicitly, as in the e2e job.
      - name: Vet, build and test
        working-directory: backend
        env:
          COMPOSE: docker compose
        run: |
          go version
          make vet build test-db

  # The aggregate check, named "test" for the same reason as "lint" above.
  test:
    name: test
    if: always()
    needs: [changes, test-go, test-frontend, test-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every test job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) echo "::error::a test job did not pass"; exit 1 ;;
          esac

  # --- slow jobs ----------------------------------------------------------------------------------------------------

  # The end-to-end test of the sync backend (docs/sync.md, "End-to-end test"): a compose stack driven by Playwright with two browser
  # contexts as devices. It runs when the backend or frontend changes, because it uses the real web build. COMPOSE is set to
  # `docker compose` (the Makefile prefers podman); Chrome comes from the runner, as in screenshots.yml.
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      # The Makefile installs the pinned playwright-core when PLAYWRIGHT_VERSION is set (inside the make target, as
      # scripts/screenshots.sh does, so the step is not an ad-hoc package install outside a lockfile for zizmor).
      - name: Run the end-to-end test
        env:
          COMPOSE: docker compose
          E2E_BROWSER_CHANNEL: chrome
          # renovate: datasource=npm depName=playwright-core
          PLAYWRIGHT_VERSION: 1.64.1
        run: make -C backend e2e

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/linux-build-deps
        with:
          packages: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
        timeout-minutes: 10

      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true # newest patch release of the version in .tool-versions, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      # Record the toolchain and GUI libraries the run used. A missing library fails the build below, so there is
      # no separate `wails3 doctor` step.
      - name: Toolchain versions
        run: |
          go version
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0

      # Proves the GUI binary still links against GTK4/WebKitGTK (cgo), exactly as the release build does.
      # `make build` builds the frontend first and uses the same flags as the release build, so the binary reviewers download is what would ship.
      - name: Build (production tags)
        run: |
          mkdir -p dist
          make build VERSION="ci-${GITHUB_SHA::7}" OUT=dist/harper-pad
          chmod +x dist/harper-pad
          ls -l dist

      # Vet with and without the production tag, reusing the packages the build just compiled.
      - name: Vet
        run: make vet

      # The Wails MCP server drives the UI and calls the services without authentication by default.
      - name: Production build contains no MCP server
        run: |
          if grep -aqF "MCP server started" dist/harper-pad; then
            echo "::error::the MCP server is present in a -tags production binary"; exit 1
          fi

      # Demo mode (fixed timings, banner) is for screenshots; a release must not have it.
      - name: Production build contains no demo mode
        run: |
          if grep -aqF "HARPER_PAD_DEMO" dist/harper-pad; then
            echo "::error::demo mode is present in a -tags production binary"; exit 1
          fi

      # The pprof endpoint exposes stacks and heap contents without authentication.
      - name: Production build contains no pprof endpoint
        run: |
          if grep -aqF "pprof endpoint started" dist/harper-pad; then
            echo "::error::the pprof endpoint is present in a -tags production binary"; exit 1
          fi

      # One named artifact per platform, like the action's "Wails Build <os> <name>". Unsigned CI build, for testing only.
      - name: Keep the binary for reviewers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harper-pad-linux-amd64
          path: dist/harper-pad
          if-no-files-found: error
          retention-days: 7

  # The Windows build needs no cgo or GUI libraries, so this runs the real thing: vet and test with the production
  # tag, then the same script the release uses to build the exe.
  windows:
    name: windows
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Vet and test
        run: |
          go vet ./...
          go vet -tags production ./...
          go test -count=1 ./...

      - name: Build the exe
        run: |
          CGO_ENABLED=0 go install -tags server github.com/wailsapp/wails/v3/cmd/wails3@"$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd frontend && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          scripts/package-windows.sh "ci-${GITHUB_SHA::7}" dist
