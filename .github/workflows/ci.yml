name: CI

# Runs on every pull request and on pushes to main. There is deliberately no
# workflow-level paths filter, so "CI / test" can be a required status check. The slow
# `build` and `windows` jobs are skipped instead (a skipped job counts as passing for a required
# check) when a pull request changes nothing that goes into a binary; see the `changes` job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail on a Go version mismatch instead of silently downloading a toolchain.
  GOTOOLCHAIN: local

jobs:
  # Decides whether a pull request touches anything that ends up in a binary. Pushes to main and manual
  # runs always build.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists the files of a pull request through the API
    outputs:
      # Pushes to main and manual runs always build.
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build }}
    steps:
      # On pull requests it lists the files through the API (no checkout needed); on pushes and manual
      # runs the filter is bypassed below.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            build:
              - '**/*.go'
              - go.mod
              - go.sum
              - .tool-versions
              - Makefile
              - Taskfile.yml
              - frontend/**
              - build/**
              - scripts/package-*
              - scripts/lib/**
              - .github/workflows/ci.yml
              - .github/actions/**

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true # newest patch release of the version in .tool-versions, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      # Biome and knip need node_modules, not a bundle: frontend/dist/.gitkeep satisfies go:embed, and the
      # build job builds the real bundle once.
      - name: Install frontend dependencies
        run: |
          node --version
          cd frontend && npm ci --ignore-scripts --no-audit --no-fund

      # Biome lint (see frontend/biome.json), format check and knip (unused exports and dependencies,
      # frontend/knip.json). Run `npm run format` to fix formatting.
      - name: Lint and check formatting (frontend)
        run: make lint-frontend

      - id: wails3
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)" >> "$GITHUB_OUTPUT"

      # The wails3 CLI takes about 40 s to compile, so keep the built binary. The key is the Wails version
      # (the CLI follows go.mod) and the Go version it was built with.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: wails3-${{ steps.go.outputs.go-version }}-${{ steps.wails3.outputs.version }}

      # frontend/bindings is generated from the Go services and committed. Regenerate it with the
      # CLI version that matches go.mod and fail if the committed copy differs (run `make bindings`).
      - name: Check Wails bindings are up to date
        run: |
          [ -x "$RUNNER_TEMP/bin/wails3" ] || GOBIN="$RUNNER_TEMP/bin" make wails3-install
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bin:$PATH" make bindings
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            git status --short -- frontend/bindings
            git diff -- frontend/bindings | head -80
            echo "::error::frontend/bindings is stale: run 'make bindings' and commit the result"; exit 1
          fi

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "These files need gofmt:"; echo "$unformatted"; exit 1; fi

      # Config in .github/linters/yamllint.yml.
      - name: Lint YAML
        env:
          # renovate: datasource=pypi depName=yamllint
          YAMLLINT_VERSION: 1.38.0
        run: |
          python3 -m pip install --user "yamllint==${YAMLLINT_VERSION}"
          PATH="$HOME/.local/bin:$PATH" yamllint --strict -c .github/linters/yamllint.yml $(git ls-files '*.yml' '*.yaml')

      - name: Check go.mod is tidy and modules verify
        run: |
          go mod tidy -diff
          go mod verify

      # Config in .github/linters/golangci.yml. Headless: this job has no GTK, so lint the server-tag build (CGO off, like
      # the headless build); the args mirror `make lint-go`. Renovate reads the version below itself and the
      # Makefile pin carries the same depName, so they are bumped in one PR.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          CGO_ENABLED: '0'
        with:
          version: v2.15.0
          args: --config .github/linters/golangci.yml --build-tags server ./...

  # Screenshots are rendered in CI and never committed (docs/ci.md, Pull request reports).
  no-screenshots:
    name: no-screenshots
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail when the PR adds screenshots
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Added, modified or renamed only: a PR that deletes screenshots is fine.
          files="$(git diff --name-only --diff-filter=AMR "$BASE_SHA...HEAD" -- docs/screenshots)"
          if [ -n "$files" ]; then
            echo "::error::Screenshots are not committed to this repository (docs/ci.md, Pull request reports). Remove docs/screenshots from this PR."
            echo "$files"
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/linux-build-deps
        with:
          packages: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
        timeout-minutes: 10

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true # newest patch release of the version in .tool-versions, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      # Record exactly which toolchain and GUI libraries a run used (as wails-build-action does with `go version`).
      - name: Toolchain versions
        run: |
          go version
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0

      # No frontend build: frontend/dist/.gitkeep satisfies go:embed, and nothing here reads the bundle.
      # `go test` runs its own vet subset; the full `make vet` runs in the build job, which has compiled the same packages.
      - name: Test
        run: make test

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/linux-build-deps
        with:
          packages: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
        timeout-minutes: 10

      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true # newest patch release of the version in .tool-versions, so stdlib fixes are picked up
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      # Record the toolchain and GUI libraries the run used. A missing library fails the build below, so there is
      # no separate `wails3 doctor` step.
      - name: Toolchain versions
        run: |
          go version
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0

      # Proves the GUI binary still links against GTK4/WebKitGTK (cgo), exactly as the release build does.
      # `make build` builds the frontend first and uses the same flags as the release build, so the binary reviewers download is what would ship.
      - name: Build (production tags)
        run: |
          mkdir -p dist
          make build VERSION="ci-${GITHUB_SHA::7}" OUT=dist/harper-pad
          chmod +x dist/harper-pad
          ls -l dist

      # Vet with and without the production tag, reusing the packages the build just compiled.
      - name: Vet
        run: make vet

      # The Wails MCP server drives the UI and calls PadService without authentication by default.
      - name: Production build contains no MCP server
        run: |
          if grep -aqF "MCP server started" dist/harper-pad; then
            echo "::error::the MCP server is present in a -tags production binary"; exit 1
          fi

      # Demo mode (fixed timings, banner) is for screenshots; a release must not have it.
      - name: Production build contains no demo mode
        run: |
          if grep -aqF "HARPER_PAD_DEMO" dist/harper-pad; then
            echo "::error::demo mode is present in a -tags production binary"; exit 1
          fi

      # The pprof endpoint exposes stacks and heap contents without authentication.
      - name: Production build contains no pprof endpoint
        run: |
          if grep -aqF "pprof endpoint started" dist/harper-pad; then
            echo "::error::the pprof endpoint is present in a -tags production binary"; exit 1
          fi

      # One named artifact per platform, like the action's "Wails Build <os> <name>". Unsigned CI build, for testing only.
      - name: Keep the binary for reviewers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harper-pad-linux-amd64
          path: dist/harper-pad
          if-no-files-found: error
          retention-days: 7

  # The Windows build needs no cgo or GUI libraries, so this runs the real thing: vet and test with the production
  # tag, then the same script the release uses to build the exe.
  windows:
    name: windows
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          # The Go cache restore took ~75 s on Windows, longer than the downloads it saves.
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Vet and test
        run: |
          go vet ./...
          go vet -tags production ./...
          go test -count=1 ./...

      - name: Build the exe
        run: |
          CGO_ENABLED=0 go install -tags server github.com/wailsapp/wails/v3/cmd/wails3@"$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd frontend && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          scripts/package-windows.sh "ci-${GITHUB_SHA::7}" dist
